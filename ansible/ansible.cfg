[defaults]
# Human-readable output
stdout_callback = ansible.builtin.default
callback_result_format = yaml
host_key_checking = True

# Don't create .retry files on failure
retry_files_enabled = false

# Roles path relative to this config file
roles_path = roles

# Faster fact gathering (gather_facts: false used, but good default)
gathering = smart

# Show elapsed time per task

[ssh_connection]
# Reuse SSH connections — critical for Unraid (prevents auth failures)
pipelining = true
# Shared authentication and multiplexing options live in group_vars/all.yml.
ssh_args = -C
