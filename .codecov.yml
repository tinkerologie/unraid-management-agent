codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "30...80"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        # At least 90% of added or changed lines must be covered by tests.
        target: 90%
        threshold: 0%
        informational: false
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

ignore:
  - "daemon/docs"
  - "tests"
