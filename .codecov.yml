codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "30...80"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 2%
        if_ci_failed: error

comment:
  layout: "reach,diff,flags,files"
  require_changes: true

ignore:
  - "daemon/docs"
  - "tests"
