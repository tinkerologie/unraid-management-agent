name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read # jobs request only what they need

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CODECOV_OIDC: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]')) }}

jobs:
  test-and-upload:
    timeout-minutes: 30
    name: Test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      id-token: write # Codecov OIDC upload
    # Skip the expensive coverage run on draft PRs to conserve runner capacity;
    # it still runs on pushes to main, workflow_dispatch, and ready (non-draft) PRs.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install test reporting tooling
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Install MQTT broker fixture
        run: sudo apt-get update && sudo apt-get install -y mosquitto

      - name: Run tests with coverage and JUnit output
        env:
          UMA_TEST_MQTT_BROKER: tcp://127.0.0.1:28883
        run: |
          # Mosquitto 2's unconfigured listener is loopback-only, with no persistence.
          # Avoid loading a runner-temp config under the packaged AppArmor profile.
          broker_log="$RUNNER_TEMP/mosquitto-uma.log"
          mosquitto -p 28883 -v > "$broker_log" 2>&1 &
          broker_pid=$!
          trap 'kill "$broker_pid" 2>/dev/null || true' EXIT
          if ! timeout 5 bash -c 'until (: </dev/tcp/127.0.0.1/28883) 2>/dev/null; do sleep 0.1; done'; then
            cat "$broker_log"
            exit 1
          fi

          "$(go env GOPATH)/bin/gotestsum" \
            --junitfile junit.xml \
            --format standard-quiet \
            -- -covermode=atomic -coverprofile=coverage.out ./...
          # The takeover fixture has the same ID and a 30s keepalive. Count
          # only the two real agent sessions, which use a 60s keepalive.
          awk '
            /New client connected.* as uma356-[0-9]+-disabled .*k60/ { disabled_connections++ }
            $2 ~ /^uma356-[0-9]+-disabled$/ && $4 ~ /\/cmd\// { disabled_subscriptions++ }
            $2 ~ /^uma356-[0-9]+$/ && $4 ~ /\/cmd\/#$/ { enabled_subscriptions++ }
            END {
              printf "Disabled agent connections: %d, disabled subscriptions: %d, enabled subscriptions: %d\n", disabled_connections, disabled_subscriptions, enabled_subscriptions
              exit !(disabled_connections >= 2 && disabled_subscriptions == 0 && enabled_subscriptions > 0)
            }
          ' "$broker_log"
          go tool cover -func=coverage.out | tail -n 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          slug: ${{ github.repository }}
          files: ./coverage.out
          flags: unittests
          name: unraid-management-agent
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          slug: ${{ github.repository }}
          files: ./junit.xml
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: false

  bundle-ownership:
    timeout-minutes: 30
    name: Bundle Ownership
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install packaging and Ansible validation tooling
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils ansible-core binutils qemu-user

      - name: Check key-only Ansible authentication
        run: make test-ansible

      # Builds the bundle, checks every entry is 0/0, then runs the .plg
      # extraction command as root against a uid-1001 archive (#242)
      - name: Run packaging tests
        run: make test-packaging

      - name: Smoke test on older CPU (Nehalem)
        run: bash scripts/check-package-artifact.sh smoke "build/unraid-management-agent-$(cat VERSION).tgz"

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: ["test-and-upload", "bundle-ownership"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful validation
        env:
          RESULTS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && '["test-and-upload","bundle-ownership"]' || '[]' }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          allowed_skips = set(json.loads(os.environ['ALLOWED_SKIPS']))
          failures = {name: job['result'] for name, job in results.items()
                      if job['result'] != 'success'
                      and not (job['result'] == 'skipped' and name in allowed_skips)}
          if not results or failures:
              print(f'::error::Required CI did not pass: {failures or "no results"}')
              sys.exit(1)
          print('All required CI jobs passed (only documented event skips allowed).')
          PYTHON
