name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read # jobs request only what they need

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CODECOV_OIDC: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]')) }}

jobs:
  test-and-upload:
    timeout-minutes: 30
    name: Test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      id-token: write # Codecov OIDC upload
    # Skip the expensive coverage run on draft PRs to conserve runner capacity;
    # it still runs on pushes to main, workflow_dispatch, and ready (non-draft) PRs.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install test reporting tooling
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run tests with coverage and JUnit output
        run: |
          "$(go env GOPATH)/bin/gotestsum" \
            --junitfile junit.xml \
            --format standard-quiet \
            -- -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          slug: ${{ github.repository }}
          files: ./coverage.out
          flags: unittests
          name: unraid-management-agent
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          slug: ${{ github.repository }}
          files: ./junit.xml
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: false

  bundle-ownership:
    timeout-minutes: 30
    name: Bundle Ownership
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install packaging and Ansible validation tooling
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils ansible-core binutils qemu-user

      - name: Check key-only Ansible authentication
        run: make test-ansible

      # Builds the bundle, checks every entry is 0/0, then runs the .plg
      # extraction command as root against a uid-1001 archive (#242)
      - name: Run packaging tests
        run: make test-packaging

      - name: Smoke test on older CPU (Nehalem)
        run: bash scripts/check-package-artifact.sh smoke "build/unraid-management-agent-$(cat VERSION).tgz"

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: ["test-and-upload", "bundle-ownership"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful validation
        env:
          RESULTS: ${{ toJSON(needs) }}
          ALLOWED_SKIPS: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && '["test-and-upload","bundle-ownership"]' || '[]' }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          allowed_skips = set(json.loads(os.environ['ALLOWED_SKIPS']))
          failures = {name: job['result'] for name, job in results.items()
                      if job['result'] != 'success'
                      and not (job['result'] == 'skipped' and name in allowed_skips)}
          if not results or failures:
              print(f'::error::Required CI did not pass: {failures or "no results"}')
              sys.exit(1)
          print('All required CI jobs passed (only documented event skips allowed).')
          PYTHON
