name: Release

# Releases are triggered three ways:
#   1. Auto-detect (push to main): when the VERSION file holds a version that
#      has no v<VERSION> tag yet AND CHANGELOG.md contains a matching
#      "## [<VERSION>] - <date>" heading, the workflow creates the tag and
#      release automatically. Bump VERSION + add the changelog section and the
#      release happens on push. No paths filter is used on purpose: the bump
#      and the changelog entry may land in separate commits, and the tag
#      existence check makes the detection idempotent either way.
#   2. Tag push (v*): the classic manual flow still works.
#   3. workflow_dispatch: optional tag input; left empty it falls back to the
#      VERSION file (same checks as auto-detect).
on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g., v2025.12.1). Leave empty to release the version in the VERSION file.
        required: false
        type: string
        default: ""

permissions:
  contents: read # jobs request only what they need

# Never run two releases at once (e.g. a tag push racing the auto-detection).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Release
    # Track the newest supported Ubuntu GitHub-hosted runner image.
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
      checkout_ref: ${{ steps.decide.outputs.checkout_ref }}

    permissions:
      contents: read # check out the repository
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether to release
        id: decide
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          SHOULD_RELEASE="false"
          TAG=""
          VERSION=""
          CHECKOUT_REF="${GITHUB_SHA}"

          if [ "${GITHUB_EVENT_NAME}" == "push" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Classic flow: a v* tag was pushed manually.
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
            CHECKOUT_REF="${GITHUB_REF}"
            SHOULD_RELEASE="true"
            echo "Trigger: tag push ($TAG)"
          elif [ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ] && [ -n "${INPUT_TAG}" ]; then
            # Manual dispatch with an explicit tag.
            TAG="${INPUT_TAG}"
            VERSION=${TAG#v}
            CHECKOUT_REF="$TAG"
            SHOULD_RELEASE="true"
            echo "Trigger: workflow_dispatch ($TAG)"
          else
            # Auto-detect: push to main (or dispatch without a tag input).
            VERSION=$(tr -d '[:space:]' < VERSION)
            TAG="v$VERSION"
            echo "Trigger: auto-detect (VERSION file: $VERSION)"

            if [ -z "$VERSION" ]; then
              echo "::error::VERSION file is empty"
              exit 1
            fi

            # Guard 1: do not release a version that is already tagged.
            if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
              echo "Tag $TAG already exists — nothing to release."
            # Guard 2: require a matching changelog heading "## [VERSION] - <date>"
            # so a VERSION bump without release notes never ships silently.
            elif ! grep -qF "## [$VERSION] -" CHANGELOG.md; then
              echo "::warning::VERSION is $VERSION but CHANGELOG.md has no '## [$VERSION] - <date>' heading yet. Skipping release until the changelog entry lands."
            else
              SHOULD_RELEASE="true"
              echo "VERSION $VERSION is untagged and has a CHANGELOG entry — releasing."
            fi
          fi

          # Pre-release detection (date-based stable versions never match).
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          {
            echo "should_release=$SHOULD_RELEASE"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "checkout_ref=$CHECKOUT_REF"
          } >> "$GITHUB_OUTPUT"

          echo "should_release=$SHOULD_RELEASE tag=$TAG version=$VERSION prerelease=$PRERELEASE"

  release:
    name: Release
    # Track the newest supported Ubuntu GitHub-hosted runner image.
    needs: detect
    if: needs.detect.outputs.should_release == 'true'

    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and tag
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

          cache: false

      - name: Install XML validation tooling
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Verify VERSION file matches tag
        env:
          DETECT_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          TAG_VERSION="${DETECT_VERSION}"

          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: VERSION file ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

          echo "✅ VERSION file matches tag: $TAG_VERSION"

      - name: Install swag CLI
        run: |
          echo "Installing swag for Swagger documentation generation..."
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          echo "✅ swag installed"

      - name: Build release package
        env:
          DETECT_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          echo "Building release package..."
          make package

          # Verify the package was created
          PACKAGE_FILE="build/unraid-management-agent-${DETECT_VERSION}.tgz"
          if [ ! -f "$PACKAGE_FILE" ]; then
            echo "ERROR: Package file not found: $PACKAGE_FILE"
            ls -la build/
            exit 1
          fi

          echo "✅ Package created: $PACKAGE_FILE"
          ls -lh "$PACKAGE_FILE"

      # Block publishing a bundle that would chown system directories on install (#242)
      - name: Verify package entries are owned by root
        env:
          DETECT_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          bash scripts/test-bundle-extraction.sh check-owners \
            "build/unraid-management-agent-${DETECT_VERSION}.tgz"

      - name: Calculate checksums
        id: checksum
        env:
          DETECT_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          PACKAGE_FILE="build/unraid-management-agent-${DETECT_VERSION}.tgz"

          # Calculate checksums (Linux uses md5sum/sha256sum, macOS uses md5/shasum)
          if command -v md5sum &> /dev/null; then
            MD5=$(md5sum "$PACKAGE_FILE" | awk '{print $1}')
          else
            MD5=$(md5 -q "$PACKAGE_FILE")
          fi
          if command -v sha256sum &> /dev/null; then
            SHA256=$(sha256sum "$PACKAGE_FILE" | awk '{print $1}')
          else
            SHA256=$(shasum -a 256 "$PACKAGE_FILE" | awk '{print $1}')
          fi

          echo "md5=$MD5" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "✅ MD5 checksum: $MD5"
          echo "✅ SHA256 checksum: $SHA256"

          # Save checksums to files for the release assets
          echo "$MD5" > build/MD5SUM
          echo "$SHA256" > build/SHA256SUM

      # Write both checksums into the .plg and assert them before anything is
      # published, so a failed rewrite blocks the release (#247).
      - name: Update PLG checksums
        env:
          CHECKSUM_MD5: ${{ steps.checksum.outputs.md5 }}
          CHECKSUM_SHA256: ${{ steps.checksum.outputs.sha256 }}
          DETECT_VERSION: ${{ needs.detect.outputs.version }}
        run: bash scripts/update-plg-checksums.sh "$CHECKSUM_MD5" "$CHECKSUM_SHA256" "$DETECT_VERSION"

      - name: Extract release notes from CHANGELOG
        id: changelog
        env:
          DETECT_VERSION: ${{ needs.detect.outputs.version }}
          CHECKSUM_MD5: ${{ steps.checksum.outputs.md5 }}
          CHECKSUM_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          VERSION="${DETECT_VERSION}"

          # Preserve the release checkout's notes through the later switch to main.
          # build/ is ignored and untracked. Extraction failure blocks publication.
          bash scripts/extract-release-notes.sh "$VERSION" > build/RELEASE_NOTES_BASE.md
          cp build/RELEASE_NOTES_BASE.md build/RELEASE_NOTES.md
          {
            echo ""
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for the full history."
          } >> build/RELEASE_NOTES.md

          # Add checksums to release notes
          {
            echo ""
            echo "---"
            echo ""
            echo "**SHA256 Checksum:**"
            echo '```'
            echo "${CHECKSUM_SHA256}  unraid-management-agent-$VERSION.tgz"
            echo '```'
            echo ""
            echo "**MD5 Checksum:**"
            echo '```'
            echo "${CHECKSUM_MD5}  unraid-management-agent-$VERSION.tgz"
            echo '```'
          } >> build/RELEASE_NOTES.md

          cat build/RELEASE_NOTES.md

      - name: Validate plugin release notes before publication
        env:
          DETECT_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          bash scripts/update-plg-changes.sh "$DETECT_VERSION" build/RELEASE_NOTES_BASE.md
          xmllint --nonet --noout unraid-management-agent.plg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # On auto-detect runs the tag does not exist yet; action-gh-release
          # creates it at target_commitish. On tag-push runs it already exists
          # and target_commitish is ignored.
          tag_name: ${{ needs.detect.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.detect.outputs.version }}
          body_path: build/RELEASE_NOTES.md
          files: |
            build/unraid-management-agent-${{ needs.detect.outputs.version }}.tgz
            build/MD5SUM
            build/SHA256SUM
          prerelease: ${{ needs.detect.outputs.prerelease }}
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # main requires pull requests; the Unraid plugin manager and Community Applications read
      # the .plg from main, so its new hash is pushed with the Tinkerologie-Release app, the
      # only actor the ruleset lets bypass that rule (GITHUB_TOKEN cannot be a bypass actor).
      - name: Mint Tinkerologie-Release token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TINKER_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.TINKER_RELEASE_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # push the PLG hash commit to main

      - name: Commit and push PLG updates
        env:
          CHECKSUM_MD5: ${{ steps.checksum.outputs.md5 }}
          CHECKSUM_SHA256: ${{ steps.checksum.outputs.sha256 }}
          DETECT_VERSION: ${{ needs.detect.outputs.version }}
          PLG_PUSH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Drop the release-checkout edit, then apply checksums and the preserved
          # release notes to main. Both helpers refuse a different manifest version.
          git checkout -- unraid-management-agent.plg
          git fetch origin main
          git checkout main
          git pull origin main
          bash scripts/update-plg-checksums.sh "$CHECKSUM_MD5" "$CHECKSUM_SHA256" "$DETECT_VERSION"
          bash scripts/update-plg-changes.sh "$DETECT_VERSION" build/RELEASE_NOTES_BASE.md
          xmllint --nonet --noout unraid-management-agent.plg

          if git diff --quiet unraid-management-agent.plg; then
            echo "PLG on main already pins these checksums and release notes"
          else
            git add unraid-management-agent.plg
            git commit -m "chore: update PLG checksums and release notes for v${DETECT_VERSION} [skip ci]"
            git push "https://x-access-token:${PLG_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
            echo "✅ Committed and pushed PLG update"
          fi

      - name: Release Summary
        env:
          DETECT_VERSION: ${{ needs.detect.outputs.version }}
          CHECKSUM_MD5: ${{ steps.checksum.outputs.md5 }}
          CHECKSUM_SHA256: ${{ steps.checksum.outputs.sha256 }}
          DETECT_PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: |
          echo "## 🎉 v${DETECT_VERSION} Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`unraid-management-agent-${DETECT_VERSION}.tgz\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**SHA256 Checksum:** \`${CHECKSUM_SHA256}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**MD5 Checksum:** \`${CHECKSUM_MD5}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${DETECT_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${DETECT_PRERELEASE}" == "true" ]; then
            echo "**Type:** Pre-release" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Type:** Stable release" >> $GITHUB_STEP_SUMMARY
          fi
