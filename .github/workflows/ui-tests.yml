name: UI Tests

# Playwright tests for the plugin settings page (#261). The page is rendered
# with the PHP CLI and every plugin endpoint is mocked, so no Unraid server or
# agent is needed.

on:
  push:
    branches: [main]
    paths:
      - "meta/plugin/**"
      - "tests/ui/**"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "meta/plugin/**"
      - "tests/ui/**"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read # jobs request only what they need

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    name: Settings page (Playwright)
    # Skip draft PRs to conserve runner capacity, like the other CI jobs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    defaults:
      run:
        working-directory: tests/ui
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      # ubuntu-latest ships the PHP CLI, which renders the .page file.
      - name: Check PHP CLI
        run: php -v

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            tests/ui/playwright-report/
            tests/ui/test-results/
          retention-days: 7
