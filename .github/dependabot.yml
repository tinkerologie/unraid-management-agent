# Dependabot (tinkerologie standard: see STANDARDS.md in tinkerologie/.github)
version: 2

updates:
  # Go modules
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      # Group minor/patch updates together to reduce PR noise
      go-minor-patch:
        update-types:
          - minor
          - patch
      # Keep major updates separate for careful review
      go-major:
        update-types:
          - major

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      actions-all:
        patterns:
          - "*"
